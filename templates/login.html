<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MeyREN | Secure Gateway</title>
<link rel="icon" type="image/png" href="/static/logo.png">
<link rel="apple-touch-icon" href="/static/logo.png">
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#06070d">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Vazirmatn:wght@400;600;700;900&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html[data-theme="dark"]{
  --bg:#06070d;
  --bg-gradient:radial-gradient(circle at 15% 25%, rgba(0, 242, 254, 0.14), transparent 35%),
                radial-gradient(circle at 85% 75%, rgba(168, 85, 247, 0.16), transparent 38%),
                radial-gradient(circle at 50% 50%, rgba(121, 40, 202, 0.08), transparent 50%);
  --surface:rgba(15, 16, 33, 0.75);
  --surface2:rgba(25, 27, 52, 0.6);
  --border:rgba(255,255,255,0.09);
  --border2:rgba(168, 85, 247, 0.3);
  --border-glow:rgba(0, 242, 254, 0.35);
  --text:#f8fafc;
  --text2:#94a3b8;
  --text3:#64748b;
  --primary:#00f2fe;
  --primary-gradient:linear-gradient(135deg, #00f2fe 0%, #38bdf8 40%, #a855f7 100%);
  --primary-glow:rgba(0, 242, 254, 0.35);
  --error:#f43f5e;
  --error-bg:rgba(244,63,94,0.1);
}
html[data-theme="light"]{
  --bg:#f3f4f8;
  --bg-gradient:radial-gradient(circle at 15% 25%, rgba(0, 180, 216, 0.1), transparent 35%),
                radial-gradient(circle at 85% 75%, rgba(147, 51, 234, 0.09), transparent 38%);
  --surface:rgba(255, 255, 255, 0.85);
  --surface2:rgba(235, 238, 246, 0.8);
  --border:rgba(0,0,0,0.08);
  --border2:rgba(147, 51, 234, 0.25);
  --border-glow:rgba(2, 132, 199, 0.3);
  --text:#0f172a;
  --text2:#475569;
  --text3:#64748b;
  --primary:#0284c7;
  --primary-gradient:linear-gradient(135deg, #0284c7 0%, #38bdf8 50%, #9333ea 100%);
  --primary-glow:rgba(2, 132, 199, 0.25);
  --error:#e11d48;
  --error-bg:rgba(225,29,72,0.08);
}
body{
  font-family:'Inter','Vazirmatn',-apple-system,BlinkMacSystemFont,sans-serif;
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  background-color:var(--bg);
  background-image:var(--bg-gradient);
  background-attachment:fixed;
  color:var(--text);
  transition:background .4s,color .4s;
}
body[dir="rtl"]{direction:rtl;text-align:right}

.toolbar{position:fixed;top:20px;right:20px;display:flex;gap:6px;z-index:10}
body[dir="rtl"] .toolbar{right:auto;left:20px}
.toolbar button{
  width:36px;
  height:36px;
  border-radius:10px;
  border:1px solid var(--border);
  background:var(--surface);
  color:var(--text2);
  cursor:pointer;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:13px;
  font-weight:700;
  transition:all .2s;
  backdrop-filter:blur(12px);
}
.toolbar button:hover{
  border-color:var(--primary);
  color:var(--primary);
  box-shadow:0 0 12px var(--primary-glow);
}

.login-page{width:100%;max-width:400px;padding:0 20px}
.login-card{
  background:var(--surface);
  backdrop-filter:blur(24px);
  -webkit-backdrop-filter:blur(24px);
  border:1px solid var(--border2);
  border-radius:24px;
  padding:42px 34px 34px;
  position:relative;
  overflow:hidden;
  box-shadow:0 20px 50px rgba(0,0,0,0.6), 0 0 30px rgba(168,85,247,0.15);
  animation:cardIn .5s cubic-bezier(0.16,1,0.3,1) forwards;
}
@keyframes cardIn{
  from{opacity:0;transform:translateY(16px) scale(0.97);}
  to{opacity:1;transform:translateY(0) scale(1);}
}
.login-card::before{
  content:'';
  position:absolute;
  top:0;left:0;right:0;
  height:3px;
  background:var(--primary-gradient);
  box-shadow:0 0 15px var(--primary);
}

.brand{text-align:center;margin-bottom:30px}
.brand-logo{
  width:76px;
  height:76px;
  border-radius:20px;
  object-fit:cover;
  filter:drop-shadow(0 0 16px rgba(0,242,254,0.5)) drop-shadow(0 0 30px rgba(168,85,247,0.4));
  margin-bottom:14px;
  transition:transform .3s;
}
.brand-logo:hover{transform:scale(1.06) rotate(3deg)}
.brand h1{
  font-size:22px;
  font-weight:900;
  background:var(--primary-gradient);
  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;
  letter-spacing:-0.03em;
}
.brand p{
  font-size:11px;
  color:var(--text3);
  margin-top:4px;
  font-weight:700;
  letter-spacing:0.08em;
  text-transform:uppercase;
}

.form-group{margin-bottom:18px}
.form-group label{
  display:block;
  font-size:11px;
  font-weight:700;
  color:var(--text2);
  margin-bottom:7px;
  text-transform:uppercase;
  letter-spacing:0.06em;
}
.form-group input{
  width:100%;
  padding:12px 14px;
  background:var(--surface2);
  border:1px solid var(--border);
  border-radius:12px;
  color:var(--text);
  font-size:14px;
  font-family:inherit;
  outline:none;
  transition:all .2s;
}
.form-group input:focus{
  border-color:var(--primary);
  box-shadow:0 0 0 3px var(--primary-glow), 0 0 15px var(--primary-glow);
}
.form-group input::placeholder{color:var(--text3)}

.login-btn{
  width:100%;
  padding:12px;
  background:var(--primary-gradient);
  border:none;
  border-radius:12px;
  color:#fff;
  font-size:14px;
  font-weight:800;
  font-family:inherit;
  cursor:pointer;
  transition:all .2s cubic-bezier(0.16,1,0.3,1);
  letter-spacing:0.02em;
  box-shadow:0 6px 20px var(--primary-glow);
}
.login-btn:hover{
  filter:brightness(1.1);
  transform:translateY(-1px);
  box-shadow:0 8px 25px var(--primary-glow), 0 0 25px rgba(168,85,247,0.4);
}
.login-btn:active{transform:scale(0.98)}

.error-msg{
  background:var(--error-bg);
  border:1px solid rgba(244,63,94,0.3);
  color:var(--error);
  padding:10px 14px;
  border-radius:10px;
  font-size:12px;
  display:none;
  margin-bottom:16px;
  text-align:center;
  font-weight:600;
}
.error-msg.show{display:block}
</style>
</head>
<body>
<div class="toolbar">
  <button id="lang-toggle" onclick="cycleLang()" title="Language">EN</button>
  <button id="theme-toggle" onclick="toggleTheme()" title="Theme">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="5"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/></svg>
  </button>
</div>
<div class="login-page">
  <div class="login-card">
    <div class="brand">
      <img src="/static/logo.png" alt="MeyREN Logo" class="brand-logo" onerror="this.style.display='none'">
      <h1>MeyREN</h1>
      <p>Secure VLESS Gateway</p>
    </div>
    <div class="error-msg" id="err-box"></div>
    <form id="login-form">
      <div class="form-group">
        <label data-en="Password" data-fa="رمز عبور">Password</label>
        <input type="password" id="password" placeholder="Enter password" autofocus required>
      </div>
      <button type="submit" class="login-btn" id="btn-submit" data-en="Sign In" data-fa="ورود">Sign In</button>
    </form>
  </div>
</div>
<script>
let lang=localStorage.getItem('ren_lang')||'en';
let theme=localStorage.getItem('ren_theme')||'dark';
function setLang(l){lang=l;document.body.dir=l==='fa'?'rtl':'ltr';document.querySelectorAll('[data-en]').forEach(el=>{const v=el.getAttribute('data-'+l);if(v)el.textContent=v});document.getElementById('lang-toggle').textContent=l.toUpperCase();localStorage.setItem('ren_lang',l)}
function cycleLang(){setLang(lang==='en'?'fa':'en')}
function applyTheme(t){theme=t;document.documentElement.setAttribute('data-theme',t);localStorage.setItem('ren_theme',t)}
function toggleTheme(){applyTheme(theme==='dark'?'light':'dark')}
applyTheme(theme);setLang(lang);
document.getElementById('login-form').addEventListener('submit',async e=>{
  e.preventDefault();const err=document.getElementById('err-box');err.classList.remove('show');
  const btn=document.getElementById('btn-submit');
  btn.disabled=true;btn.textContent=(lang==='fa'?'در حال ورود...':'Signing in...');
  try{
    const r=await fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({password:document.getElementById('password').value})});
    if(!r.ok){const d=await r.json().catch(()=>({}));throw new Error(d.detail||'Failed');}
    location.href='/dashboard';
  }catch(e){
    err.textContent=e.message;err.classList.add('show');
    btn.disabled=false;btn.textContent=(lang==='fa'?'ورود':'Sign In');
  }
});
</script>
</body>
</html>
